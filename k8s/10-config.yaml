apiVersion: v1
kind: ConfigMap
metadata:
  name: livraria-config
  namespace: n3-rafael
data:
  PORT: "3000"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: livraria
  DB_USER: livraria
  REDIS_URL: redis://redis:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credenciais
  namespace: n3-rafael
type: Opaque
stringData:
  # Valores fictícios usados no laboratório.
  mysql-password: loja-demo
  mysql-root-password: root-demo
